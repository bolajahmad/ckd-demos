[workspace]
resolver = "3"
members = ["crates/cli", "crates/sdk"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
sdk = { path = "crates/sdk" }

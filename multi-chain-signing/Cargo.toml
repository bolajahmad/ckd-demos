[workspace]
resolver = "3"
members = ["crates/cli", "crates/sdk"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = { version = "0.10", features = [] }
p256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
dotenv = "0.15.0"
tiny-bip39 = "1.0.0"
bip32 = { version = "0.5.3", features = ["alloc"] }
ckb-sdk = "5.1.0"
ckb-hash = "1.1.0"
ckb-types = "1.1.1"
ckb-crypto = "1.1.0"
secp256k1 = "0.30"
sdk = { path = "crates/sdk" }
